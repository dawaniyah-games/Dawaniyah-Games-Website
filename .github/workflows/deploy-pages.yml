name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  # Fired by the UiFramework repo when its docs change on main.
  repository_dispatch:
    types: [ uiframework-docs-updated ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # The UI Framework docs (served at /uiframework/) come straight from the UiFramework repo.
      - name: Checkout UiFramework docs
        uses: actions/checkout@v4
        with:
          repository: dawaniyah-games/UiFramework
          ref: main
          path: .uiframework
          sparse-checkout: docs

      - name: Sync UiFramework docs
        env:
          UIFRAMEWORK_DOCS_DIR: .uiframework/docs
        run: npm run sync:uiframework-docs

      - name: Build
        env:
          VITE_BASE: ${{ secrets['VITE_BASE'] }}
          VITE_SITE_URL: https://www.dawaniyahgames.com
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
